services:
  - type: web
    name: driving-school-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVarGroups:
      - name: driving-school-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: drivinity_jwt_secret_key_2026_super_secure_production
