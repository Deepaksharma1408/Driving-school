version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: drivinity_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: drivinity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drivinity_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/drivinity_db
      JWT_SECRET: super_secret_drivinity_jwt_production_key_2026
      BREVO_API_KEY: ${BREVO_API_KEY:-""}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-""}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-""}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-""}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Nginx Frontend Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drivinity_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
